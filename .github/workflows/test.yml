name: RELIC checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original cards, decks, economy and duels
        run: npm test
      - name: Install verification dependencies
        run: npm ci
      - name: Validate illustrations and build static site
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and phone browser verification
        run: npm run test:browser -- --workers=2
      - name: Keep screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: test-results/
